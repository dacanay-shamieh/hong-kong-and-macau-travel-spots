<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Contact Information</h1>
  </header>
 <section>
   <ul>
     <li>Email <a href="mailto:hk&mtravelspots@gmail.com">hk&mtravelspots@gmail.com</a></li>
     <li>Phone: +63 918 358 1669</li>
   </ul>
 </section>
  
  <main>
  <form>
    
    <fieldset>
      <legend style="text-align: center;">Your details</legend>
      
      <p>
        <label for="name">Name</label><br>
        <input type="text" id="name" name="name" required>
      </p>
      
      <p>
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required>
      </p>
      
      <p>
        <label for="subject">Subject</label><br>
        <select id="subject" name="subject">
          <option value="product-question">General Inquiry</option>
          <option value="order-status">Travel Tips</option>
          <option value="custom-art">Transportation/Destination Questions</option>
          <option value="wholesale">Itinerary Suggestions</option>
          <option value="other">Other</option>
        </select>
      </p>
      
      <p>
        <label for="message">Message</label><br>
        <textarea id="message" name="message" required></textarea>
      </p>
      
      <button type="submit">Send message</button>
      
    </fieldset>
    
  </form>
</main>
</body>

</center>

</html>
